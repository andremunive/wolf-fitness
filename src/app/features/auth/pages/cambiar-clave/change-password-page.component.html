<main class="change-shell">
  <div class="change-frame">
    <!-- Panel izquierdo (desktop) / inferior (mobile): formulario -->
    <section class="change-form-panel" role="region" aria-labelledby="change-title">
      <header class="change-form-panel__brand">
        <img
          src="assets/logo/logo_completo.png"
          alt="Wolf Fitness"
          class="change-form-panel__logo"
        />
      </header>

      <div class="change-form-panel__body">
        <h1 id="change-title" class="text-2xl sm:text-3xl font-semibold text-ink tracking-tight">
          Define tu nueva contraseña
        </h1>
        <p class="mt-2 rounded-xl bg-primary-50 px-4 py-2.5 text-sm text-primary-700 border border-primary-100">
          Es tu primer inicio de sesión. Por seguridad, define una nueva contraseña para continuar.
        </p>

        <div
          *ngIf="errorMessage"
          role="alert"
          class="mt-3 rounded-xl border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-700"
        >
          {{ errorMessage }}
        </div>

        <form
          class="mt-4 space-y-3"
          [formGroup]="form"
          (ngSubmit)="submit()"
          novalidate
        >
          <div>
            <label for="new-password" class="block text-sm font-medium text-ink">
              Nueva contraseña
            </label>
            <div class="relative mt-1.5">
              <input
                id="new-password"
                [type]="showPassword ? 'text' : 'password'"
                autocomplete="new-password"
                formControlName="password"
                placeholder="Mínimo 8 caracteres"
                class="block w-full min-h-touch rounded-xl border border-surface-border bg-white px-4 pr-12 text-ink placeholder:text-ink-soft/60 transition focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30 disabled:opacity-60"
                [class.border-red-300]="password.invalid && password.touched"
              />
              <button
                type="button"
                class="password-toggle"
                (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              >
                <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
                </svg>
              </button>
            </div>
            <p
              *ngIf="password.touched && password.errors?.['required']"
              class="mt-1.5 text-xs text-red-600"
            >
              La contraseña es obligatoria.
            </p>
            <p
              *ngIf="password.touched && password.errors?.['minlength']"
              class="mt-1.5 text-xs text-red-600"
            >
              Debe tener al menos 8 caracteres.
            </p>
          </div>

          <div>
            <label for="confirm-password" class="block text-sm font-medium text-ink">
              Confirmar contraseña
            </label>
            <div class="relative mt-1.5">
              <input
                id="confirm-password"
                [type]="showConfirm ? 'text' : 'password'"
                autocomplete="new-password"
                formControlName="confirm"
                placeholder="Repite tu nueva contraseña"
                class="block w-full min-h-touch rounded-xl border border-surface-border bg-white px-4 pr-12 text-ink placeholder:text-ink-soft/60 transition focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30 disabled:opacity-60"
                [class.border-red-300]="(confirm.invalid && confirm.touched) || mismatch"
              />
              <button
                type="button"
                class="password-toggle"
                (click)="showConfirm = !showConfirm"
                [attr.aria-label]="showConfirm ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              >
                <svg *ngIf="!showConfirm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <svg *ngIf="showConfirm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
                </svg>
              </button>
            </div>
            <p
              *ngIf="confirm.touched && confirm.errors?.['required']"
              class="mt-1.5 text-xs text-red-600"
            >
              Confirma tu nueva contraseña.
            </p>
            <p
              *ngIf="mismatch"
              class="mt-1.5 text-xs text-red-600"
            >
              Las contraseñas no coinciden.
            </p>
          </div>

          <button
            type="submit"
            class="mt-1 inline-flex w-full min-h-touch items-center justify-center gap-2 rounded-xl bg-primary px-4 py-3 text-base font-semibold text-white shadow-sm transition hover:bg-primary-600 active:bg-primary-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-70"
            [disabled]="submitting"
          >
            <svg
              *ngIf="submitting"
              class="h-5 w-5 animate-spin text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
              ></path>
            </svg>
            <span>{{ submitting ? 'Actualizando...' : 'Actualizar contraseña' }}</span>
          </button>
        </form>
      </div>
    </section>

    <!-- Panel derecho (desktop) / superior (mobile): arte + glow -->
    <aside class="change-art-panel" aria-hidden="true">
      <div class="art-glow art-glow--core"></div>
      <div class="art-glow art-glow--halo"></div>
      <div class="art-rays"></div>
      <img
        src="assets/png/rusas.png"
        alt=""
        class="art-image"
        loading="eager"
        decoding="async"
      />
    </aside>
  </div>
</main>
