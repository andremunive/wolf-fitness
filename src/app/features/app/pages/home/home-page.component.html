<ng-container *ngIf="profile$ | async as profile">
  <div class="home-shell">
    <main class="home-main">
      <div class="home-card">
        <span class="home-role-chip">
          <span class="home-role-chip__dot"></span>
          {{ roleLabel(profile.role) }}
        </span>

        <h2 class="mt-4 text-2xl font-semibold text-ink tracking-tight">
          Bienvenido, {{ firstName(profile) }}
        </h2>
        <p class="mt-2 text-sm text-ink-muted">
          Accede rápidamente a las secciones más usadas del gimnasio.
        </p>

        <!-- Acciones rápidas según rol -->
        <div class="home-quick-actions">
          <!-- Admin y trainer: ver clientes -->
          <a
            *ngIf="profile.role === 'admin' || profile.role === 'trainer'"
            routerLink="/app/clientes"
            class="home-action-card"
          >
            <span class="home-action-card__icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z"
                />
              </svg>
            </span>
            <span class="home-action-card__label">Clientes</span>
            <svg
              class="home-action-card__caret"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </a>

          <!-- Solo admin: estadísticas de clientes -->
          <a
            *ngIf="profile.role === 'admin'"
            routerLink="/app/estadisticas/clientes"
            class="home-action-card"
          >
            <span class="home-action-card__icon" aria-hidden="true">
              <!-- chart icon — mismo SVG que usa el toolbar en la sección "Estadísticas" -->
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                />
              </svg>
            </span>
            <span class="home-action-card__label">Estadísticas - Clientes</span>
            <svg
              class="home-action-card__caret"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </a>

          <!-- Solo admin: estadísticas de finanzas -->
          <a
            *ngIf="profile.role === 'admin'"
            routerLink="/app/estadisticas/finanzas"
            class="home-action-card"
          >
            <span class="home-action-card__icon" aria-hidden="true">
              <!-- dollar icon — mismo SVG que usa el toolbar en la sección "Finanzas" -->
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
            </span>
            <span class="home-action-card__label">Estadísticas - Finanzas</span>
            <svg
              class="home-action-card__caret"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </a>
        </div>
      </div>
    </main>
  </div>
</ng-container>
