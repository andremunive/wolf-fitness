<ng-container *ngIf="profile$ | async as profile">
  <div class="home-shell">
    <main class="home-main">
      <div class="home-card">
        <span class="home-role-chip">
          <span class="home-role-chip__dot"></span>
          {{ roleLabel(profile.role) }}
        </span>

        <h2 class="mt-4 text-2xl font-semibold text-ink tracking-tight">
          Bienvenido, {{ firstName(profile) }}
        </h2>
        <p class="mt-2 text-sm text-ink-muted">
          Accede rápidamente a las secciones más usadas del gimnasio.
        </p>

        <!-- Acciones rápidas según rol -->
        <div class="home-quick-actions">
          <!-- Admin y trainer: ver clientes -->
          <a
            *ngIf="profile.role === 'admin' || profile.role === 'trainer'"
            routerLink="/app/clientes"
            class="home-action-card"
          >
            <span class="home-action-card__icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z"
                />
              </svg>
            </span>
            <span class="home-action-card__label">Clientes</span>
            <svg
              class="home-action-card__caret"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </a>

          <!-- Solo admin: ver entrenadores -->
          <a
            *ngIf="profile.role === 'admin'"
            routerLink="/app/entrenadores"
            class="home-action-card"
          >
            <span class="home-action-card__icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
            </span>
            <span class="home-action-card__label">Entrenadores</span>
            <svg
              class="home-action-card__caret"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </a>
        </div>
      </div>
    </main>
  </div>
</ng-container>
