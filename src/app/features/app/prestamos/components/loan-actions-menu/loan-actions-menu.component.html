<div class="loan-menu">
  <button
    type="button"
    class="loan-menu__trigger"
    [class.loan-menu__trigger--open]="isOpen"
    (click)="toggle($event)"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="menu"
    [attr.aria-label]="'Acciones del préstamo de ' + loan.beneficiary_label"
  >
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="12" cy="5"  r="1.6"/>
      <circle cx="12" cy="12" r="1.6"/>
      <circle cx="12" cy="19" r="1.6"/>
    </svg>
  </button>

  <div
    *ngIf="isOpen"
    class="loan-menu__dropdown"
    [ngStyle]="dropdownStyle"
    role="menu"
  >
    <!-- Ver detalle — siempre habilitado -->
    <button
      type="button"
      class="loan-menu__item loan-menu__item--primary"
      role="menuitem"
      (click)="onDetail()"
    >
      <span class="loan-menu__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </span>
      <span class="loan-menu__label">Ver detalle</span>
    </button>

    <!-- Abonar — solo si activo -->
    <button
      *ngIf="loan.status === 'active'"
      type="button"
      class="loan-menu__item"
      role="menuitem"
      (click)="onPayment()"
    >
      <span class="loan-menu__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
        </svg>
      </span>
      <span class="loan-menu__label">Abonar</span>
    </button>

    <!-- Editar — activo en loans activos -->
    <button
      *ngIf="loan.status === 'active'"
      type="button"
      class="loan-menu__item"
      role="menuitem"
      (click)="onEdit()"
    >
      <span class="loan-menu__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </span>
      <span class="loan-menu__label">Editar</span>
    </button>

    <!-- Cerrar préstamo — icono dinámico según saldo -->
    <button
      *ngIf="loan.status === 'active'"
      type="button"
      class="loan-menu__item"
      role="menuitem"
      (click)="onClose()"
    >
      <!-- Saldo = 0: check verde -->
      <span
        *ngIf="isLoanPaidOff"
        class="loan-menu__icon loan-menu__icon--success"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </span>
      <!-- Saldo > 0: alerta amber -->
      <span
        *ngIf="!isLoanPaidOff"
        class="loan-menu__icon loan-menu__icon--warning"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
        </svg>
      </span>
      <span class="loan-menu__label">Cerrar préstamo</span>
    </button>
  </div>
</div>
