<article class="trainer-card" [attr.aria-label]="'Entrenador: ' + trainer.fullName">
  <div class="trainer-card__header">
    <div class="trainer-card__avatar" aria-hidden="true">{{ initials }}</div>

    <div class="trainer-card__info">
      <p class="trainer-card__name">{{ trainer.fullName }}</p>
      <p class="trainer-card__email">{{ trainer.email }}</p>
    </div>

    <!-- Estado (chip) -->
    <span
      class="trainer-card__status-chip"
      [class.trainer-card__status-chip--active]="trainer.isActive"
      [class.trainer-card__status-chip--inactive]="!trainer.isActive"
    >
      {{ trainer.isActive ? 'Activo' : 'Inactivo' }}
    </span>

    <app-trainer-actions-menu
      [trainer]="trainer"
      dropdownAlign="right"
      (editRequested)="editRequested.emit($event)"
      (toggleActiveRequested)="toggleActiveRequested.emit($event)"
      (resetPasswordRequested)="resetPasswordRequested.emit($event)"
    ></app-trainer-actions-menu>
  </div>

  <div class="trainer-card__quincenas">
    <div class="trainer-card__quincena">
      <span class="trainer-card__quincena-label">Clientes Q1</span>
      <div class="trainer-card__quincena-badges">
        <ng-container *ngIf="q1Badges.length; else q1Empty">
          <span
            *ngFor="let badge of q1Badges; trackBy: trackByPlanCode"
            class="trainer-card__plan-chip"
            [class.trainer-card__plan-chip--6d]="badge.planCode === 'plan_6d'"
            [class.trainer-card__plan-chip--3d]="badge.planCode === 'plan_3d'"
          >
            {{ badge.count }} - {{ badge.abbr }}
          </span>
        </ng-container>
        <ng-template #q1Empty><span class="trainer-card__quincena-empty">—</span></ng-template>
      </div>
    </div>

    <div class="trainer-card__quincena">
      <span class="trainer-card__quincena-label">Clientes Q2</span>
      <div class="trainer-card__quincena-badges">
        <ng-container *ngIf="q2Badges.length; else q2Empty">
          <span
            *ngFor="let badge of q2Badges; trackBy: trackByPlanCode"
            class="trainer-card__plan-chip"
            [class.trainer-card__plan-chip--6d]="badge.planCode === 'plan_6d'"
            [class.trainer-card__plan-chip--3d]="badge.planCode === 'plan_3d'"
          >
            {{ badge.count }} - {{ badge.abbr }}
          </span>
        </ng-container>
        <ng-template #q2Empty><span class="trainer-card__quincena-empty">—</span></ng-template>
      </div>
    </div>
  </div>

  <div class="trainer-card__meta">
    <!-- Teléfono -->
    <div class="trainer-card__meta-item">
      <svg class="trainer-card__meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"/>
      </svg>
      <span>{{ trainer.phone }}</span>
    </div>

    <!-- Documento -->
    <div class="trainer-card__meta-item">
      <svg class="trainer-card__meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5zm6-10.125a1.875 1.875 0 11-3.75 0 1.875 1.875 0 013.75 0zm1.294 6.336a6.721 6.721 0 01-3.17.789 6.721 6.721 0 01-3.168-.789 3.376 3.376 0 016.338 0z"/>
      </svg>
      <span>{{ documentLabel }}</span>
    </div>

    <!-- Banco -->
    <div class="trainer-card__meta-item">
      <svg class="trainer-card__meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
      </svg>
      <span>{{ bankLabel }} · {{ formattedAccountNumber }}</span>
    </div>
  </div>
</article>
