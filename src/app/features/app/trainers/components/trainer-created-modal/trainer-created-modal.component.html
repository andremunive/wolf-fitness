<div class="success-backdrop" role="dialog" aria-modal="true" aria-labelledby="success-title">
  <div class="success-sheet" (click)="$event.stopPropagation()">

    <div class="success-sheet__icon-wrap" aria-hidden="true">
      <svg class="success-sheet__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>

    <h2 id="success-title" class="success-sheet__title">
      Entrenador registrado
    </h2>
    <p class="success-sheet__subtitle">
      Entrega esta contraseña temporal al entrenador. Deberá cambiarla en su primer inicio de sesión.
    </p>

    <div class="success-sheet__email-row" aria-label="Correo del entrenador">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
      </svg>
      <span>{{ result.email }}</span>
    </div>

    <div class="success-sheet__password-block" role="region" aria-label="Contraseña temporal">
      <p class="success-sheet__password-label">Contraseña temporal</p>
      <div class="success-sheet__password-row">
        <code class="success-sheet__password">{{ result.temporary_password }}</code>
        <button
          type="button"
          class="success-sheet__copy-btn"
          [class.success-sheet__copy-btn--copied]="isCopied"
          (click)="copyToClipboard()"
          [attr.aria-label]="isCopied ? 'Copiado' : 'Copiar contraseña al portapapeles'"
        >
          <!-- Ícono check cuando está copiado -->
          <svg *ngIf="isCopied" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
          </svg>
          <!-- Ícono copiar cuando no está copiado -->
          <svg *ngIf="!isCopied" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75"/>
          </svg>
          <span>{{ isCopied ? 'Copiado' : 'Copiar' }}</span>
        </button>
      </div>
      <p class="success-sheet__copy-error" *ngIf="copyError" role="alert">
        No se pudo copiar. Copia la contraseña manualmente.
      </p>
    </div>

    <div class="success-sheet__footer">
      <button
        type="button"
        class="success-sheet__done-btn"
        (click)="dismiss()"
      >
        Listo
      </button>
    </div>

  </div>
</div>
