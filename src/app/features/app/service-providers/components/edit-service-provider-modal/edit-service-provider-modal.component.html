<div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Editar proveedor" (click)="closeWithConfirmation()">
  <div class="modal-sheet" (click)="$event.stopPropagation()" appFocusTrap (appFocusTrapEscape)="closeWithConfirmation()">

    <!-- Header -->
    <div class="modal-sheet__header">
      <div class="modal-sheet__avatar" aria-hidden="true">{{ avatarInitials }}</div>
      <div class="modal-sheet__header-info">
        <h2 class="modal-sheet__title">{{ provider.name }}</h2>
        <p class="modal-sheet__subtitle">{{ provider.serviceTypeName }}</p>
      </div>
      <button type="button" class="modal-sheet__close" (click)="close()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Tabs -->
    <div class="modal-tabs" role="tablist">
      <button
        *ngFor="let tab of tabs; trackBy: trackByTabId"
        type="button"
        class="modal-tabs__tab"
        [class.modal-tabs__tab--active]="currentTab === tab.id"
        (click)="switchTab(tab.id)"
        role="tab"
        [attr.aria-selected]="currentTab === tab.id"
      >{{ tab.label }}</button>
    </div>

    <!-- Body -->
    <div class="modal-body">

      <!-- Identity tab -->
      <form *ngIf="currentTab === 'identity'" [formGroup]="identityForm" class="edit-form" novalidate>

        <div class="form-field">
          <label class="form-field__label" for="edit-name">Nombre / Razón social <span class="form-field__required" aria-hidden="true">*</span></label>
          <input id="edit-name" type="text" class="form-field__input"
            [class.form-field__input--error]="identityForm.get('name')?.invalid && identityForm.get('name')?.touched"
            formControlName="name" placeholder="Nombre o razón social"/>
          <p class="form-field__error" *ngIf="identityForm.get('name')?.errors?.['required'] && identityForm.get('name')?.touched">El nombre es obligatorio.</p>
        </div>

        <div class="form-field">
          <span class="form-field__label">Tipo de entidad <span class="form-field__required" aria-hidden="true">*</span></span>
          <div class="radio-group" role="radiogroup">
            <label *ngFor="let opt of entityTypeOptions; trackBy: trackByValue" class="radio-option">
              <input type="radio" class="radio-option__input" formControlName="entity_type" [value]="opt.value"/>
              <span class="radio-option__dot" aria-hidden="true"></span>
              <span class="radio-option__label">{{ opt.label }}</span>
            </label>
          </div>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="edit-doc-type">Tipo de documento <span class="form-field__required" aria-hidden="true">*</span></label>
          <select id="edit-doc-type" class="form-field__select" formControlName="document_type">
            <option *ngFor="let opt of documentTypeOptions; trackBy: trackByValue" [value]="opt.value">{{ opt.label }}</option>
          </select>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="edit-doc-number">Número de documento <span class="form-field__required" aria-hidden="true">*</span></label>
          <input id="edit-doc-number" type="text" class="form-field__input"
            [class.form-field__input--error]="identityForm.get('document_number')?.invalid && identityForm.get('document_number')?.touched"
            formControlName="document_number" placeholder="Número de documento"/>
          <p class="form-field__error" *ngIf="identityForm.get('document_number')?.errors?.['required'] && identityForm.get('document_number')?.touched">El documento es obligatorio.</p>
          <p class="form-field__error" *ngIf="identityForm.get('document_number')?.errors?.['minlength'] && identityForm.get('document_number')?.touched">Mínimo 4 caracteres.</p>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="edit-service-type">Tipo de servicio <span class="form-field__required" aria-hidden="true">*</span></label>
          <select id="edit-service-type" class="form-field__select" formControlName="service_type_id">
            <option value="" disabled>Selecciona un tipo</option>
            <option *ngFor="let t of serviceTypes; trackBy: trackByTypeId" [value]="t.id">{{ t.name }}</option>
          </select>
        </div>

      </form>

      <!-- Contact tab -->
      <form *ngIf="currentTab === 'contact'" [formGroup]="contactForm" class="edit-form" novalidate>

        <div class="form-field">
          <label class="form-field__label" for="edit-phone">Teléfono <span class="form-field__optional">(opcional)</span></label>
          <input id="edit-phone" type="tel" class="form-field__input"
            [class.form-field__input--error]="contactForm.get('phone')?.invalid && contactForm.get('phone')?.touched"
            formControlName="phone" placeholder="3001234567" inputmode="numeric"/>
          <p class="form-field__error" *ngIf="contactForm.get('phone')?.errors?.['pattern'] && contactForm.get('phone')?.touched">Solo dígitos, entre 7 y 15 caracteres.</p>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="edit-email">Correo electrónico <span class="form-field__optional">(opcional)</span></label>
          <input id="edit-email" type="email" class="form-field__input"
            [class.form-field__input--error]="contactForm.get('email')?.invalid && contactForm.get('email')?.touched"
            formControlName="email" placeholder="proveedor@ejemplo.com"/>
          <p class="form-field__error" *ngIf="contactForm.get('email')?.errors?.['invalidEmail'] && contactForm.get('email')?.touched">Ingresa un correo válido.</p>
        </div>

        <div class="form-field">
          <label class="form-field__label" for="edit-description">Notas / Descripción <span class="form-field__optional">(opcional)</span></label>
          <textarea id="edit-description" class="form-field__textarea" formControlName="description" rows="3" placeholder="Información adicional..."></textarea>
        </div>

      </form>

      <!-- Feedback -->
      <div class="edit-feedback" *ngIf="saveSuccess" role="status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        Cambios guardados correctamente.
      </div>

      <div class="edit-error" *ngIf="saveError" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
        </svg>
        {{ saveError }}
      </div>

    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button type="button" class="modal-footer__cancel" (click)="close()">Cancelar</button>
      <button
        type="button"
        class="modal-footer__save"
        (click)="save()"
        [disabled]="!hasChanges || isSaving || !activeForm.valid"
      >Guardar cambios</button>
    </div>

  </div>
</div>
