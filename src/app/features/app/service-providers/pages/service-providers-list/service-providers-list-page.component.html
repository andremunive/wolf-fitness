<div class="sp-page">

  <!-- ===== HEADER ===== -->
  <header class="sp-page__header">
    <div class="sp-page__header-content">
      <div class="sp-page__title-row">
        <h1 class="sp-page__title">
          Proveedores
          <ng-container *ngIf="viewState$ | async as state">
            <span *ngIf="!state.loading" class="sp-page__count">({{ state.total }})</span>
          </ng-container>
        </h1>

        <button
          type="button"
          class="sp-page__manage-types-btn"
          (click)="openServiceTypesModal()"
          aria-label="Gestionar tipos de servicio"
          title="Gestionar tipos de servicio"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span class="sp-page__manage-types-label">Tipos</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== TOOLBAR ===== -->
  <div class="sp-page__toolbar">
    <div class="sp-page__search-row">
      <app-service-providers-search-bar
        class="sp-page__search"
        (searchChange)="onSearchChange($event)"
      ></app-service-providers-search-bar>

      <app-service-providers-filters
        [currentFilters]="currentFilters"
        [serviceTypes]="serviceTypes"
        (filtersChange)="onFiltersChange($event)"
      ></app-service-providers-filters>
    </div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="sp-page__main">
    <ng-container *ngIf="viewState$ | async as state">

      <!-- Loading skeleton -->
      <ng-container *ngIf="state.loading">
        <div class="sp-page__skeleton-list" aria-hidden="true">
          <div *ngFor="let i of [1,2,3,4]" class="skeleton-card">
            <div class="skeleton-card__header">
              <div class="skeleton skeleton--avatar"></div>
              <div class="skeleton-card__lines">
                <div class="skeleton skeleton--line-lg"></div>
                <div class="skeleton skeleton--line-sm"></div>
              </div>
            </div>
            <div class="skeleton-card__meta">
              <div class="skeleton skeleton--line-md"></div>
              <div class="skeleton skeleton--line-md"></div>
            </div>
          </div>
        </div>

        <div class="sp-page__skeleton-table" aria-hidden="true">
          <div class="skeleton-table">
            <div class="skeleton-table__header skeleton skeleton--full"></div>
            <div *ngFor="let i of [1,2,3,4]" class="skeleton-table__row">
              <div class="skeleton skeleton--full"></div>
            </div>
          </div>
        </div>
      </ng-container>

      <!-- Error state -->
      <div *ngIf="state.error && !state.loading" class="sp-page__empty">
        <div class="sp-page__empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
          </svg>
        </div>
        <p class="sp-page__empty-title">Error al cargar proveedores</p>
        <p class="sp-page__empty-msg">Revisa tu conexión e intenta de nuevo.</p>
        <button type="button" class="sp-page__retry-btn" (click)="retry()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Reintentar
        </button>
      </div>

      <!-- Empty state -->
      <div
        *ngIf="!state.loading && !state.error && state.providers.length === 0"
        class="sp-page__empty"
      >
        <div class="sp-page__empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 00.75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 00-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0112 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 01-.673-.38m0 0A2.18 2.18 0 013 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 013.413-.387m7.5 0V5.25A2.25 2.25 0 0013.5 3h-3a2.25 2.25 0 00-2.25 2.25v.894m7.5 0a48.667 48.667 0 00-7.5 0"/>
          </svg>
        </div>
        <p class="sp-page__empty-title">
          <ng-container *ngIf="searchControl.value; else noSearchTitle">
            Sin resultados para "{{ searchControl.value }}"
          </ng-container>
          <ng-template #noSearchTitle>No hay proveedores registrados</ng-template>
        </p>
        <p class="sp-page__empty-msg">
          <ng-container *ngIf="searchControl.value; else noSearchMsg">
            Prueba con otro término de búsqueda.
          </ng-container>
          <ng-template #noSearchMsg>Crea el primer proveedor con el botón +.</ng-template>
        </p>
      </div>

      <!-- Cards (mobile) + Table (desktop) -->
      <ng-container *ngIf="!state.loading && !state.error && state.providers.length > 0">

        <!-- Cards mobile -->
        <div class="sp-page__card-list">
          <app-service-provider-card
            *ngFor="let provider of state.providers; trackBy: trackByProviderId"
            [provider]="provider"
            (editRequested)="onEditRequested($event)"
            (manageBankAccountsRequested)="onManageBankAccountsRequested($event)"
            (softDeleteRequested)="onSoftDeleteRequested($event)"
            (restoreRequested)="onRestoreRequested($event)"
          ></app-service-provider-card>
        </div>

        <!-- Table desktop -->
        <div class="sp-page__table-wrapper">
          <app-service-providers-table
            [providers]="state.providers"
            (editRequested)="onEditRequested($event)"
            (manageBankAccountsRequested)="onManageBankAccountsRequested($event)"
            (softDeleteRequested)="onSoftDeleteRequested($event)"
            (restoreRequested)="onRestoreRequested($event)"
          ></app-service-providers-table>
        </div>

        <!-- Pagination -->
        <app-service-providers-pagination
          [state]="state.paginationState"
          (pageChange)="onPageChange($event)"
          (pageSizeChange)="onPageSizeChange($event)"
        ></app-service-providers-pagination>

      </ng-container>

    </ng-container>
  </main>

  <!-- FAB -->
  <button
    type="button"
    class="sp-page__fab"
    (click)="openWizard()"
    aria-label="Nuevo proveedor"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
    </svg>
  </button>

</div>

<!-- ===== WIZARD NUEVO PROVEEDOR ===== -->
<app-new-service-provider-wizard
  *ngIf="isWizardOpen"
  [serviceTypes]="serviceTypes"
  (closed)="closeWizard()"
  (providerCreated)="onProviderCreated($event)"
></app-new-service-provider-wizard>

<!-- ===== MODAL PROVEEDOR CREADO ===== -->
<app-service-provider-created-modal
  *ngIf="createdProvider"
  [provider]="createdProvider"
  (dismissed)="dismissCreatedModal()"
></app-service-provider-created-modal>

<!-- ===== MODAL EDITAR ===== -->
<app-edit-service-provider-modal
  *ngIf="editingProvider"
  [provider]="editingProvider"
  [serviceTypes]="serviceTypes"
  (closed)="closeEditModal()"
  (providerUpdated)="onProviderUpdated()"
></app-edit-service-provider-modal>

<!-- ===== MODAL CUENTAS BANCARIAS ===== -->
<app-service-provider-bank-accounts-modal
  *ngIf="bankAccountsProvider"
  [provider]="bankAccountsProvider"
  (closed)="closeBankAccountsModal()"
  (accountsUpdated)="onBankAccountsUpdated()"
></app-service-provider-bank-accounts-modal>

<!-- ===== MODAL TIPOS DE SERVICIO ===== -->
<app-service-types-management-modal
  *ngIf="isServiceTypesModalOpen"
  (closed)="closeServiceTypesModal()"
></app-service-types-management-modal>
