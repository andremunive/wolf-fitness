<div class="actions-menu">
  <button
    type="button"
    class="actions-menu__trigger"
    [class.actions-menu__trigger--open]="isOpen"
    (click)="toggle($event)"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="menu"
    [attr.aria-label]="'Acciones para ' + client.fullName"
  >
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="12" cy="5" r="1.6"/>
      <circle cx="12" cy="12" r="1.6"/>
      <circle cx="12" cy="19" r="1.6"/>
    </svg>
  </button>

  <div
    *ngIf="isOpen"
    class="actions-menu__dropdown"
    [ngStyle]="dropdownStyle"
    role="menu"
  >
    <!-- 1. Registrar pago — solo admin y solo para clientes activos -->
    <button
      *ngIf="isAdmin && client.status === 'active'"
      type="button"
      class="actions-menu__item actions-menu__item--primary"
      role="menuitem"
      (click)="onRegisterPayment()"
    >
      <span class="actions-menu__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
        </svg>
      </span>
      <span class="actions-menu__label">Registrar pago</span>
    </button>

    <!-- 2. Editar -->
    <button
      type="button"
      class="actions-menu__item"
      role="menuitem"
      (click)="onEdit()"
    >
      <span class="actions-menu__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </span>
      <span class="actions-menu__label">Editar</span>
    </button>

    <!-- 3. Medidas — visible para todos (admin y trainer via RLS) -->
    <button
      type="button"
      class="actions-menu__item"
      role="menuitem"
      (click)="onMeasurements()"
    >
      <span class="actions-menu__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
      </span>
      <span class="actions-menu__label">Medidas</span>
    </button>

    <!-- 4. Desactivar -->
    <button
      *ngIf="client.status === 'active'"
      type="button"
      class="actions-menu__item actions-menu__item--danger"
      role="menuitem"
      (click)="onDeactivate()"
    >
      <span class="actions-menu__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
        </svg>
      </span>
      <span class="actions-menu__label">Desactivar</span>
    </button>
  </div>
</div>
