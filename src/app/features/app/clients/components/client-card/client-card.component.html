<article class="client-card" [attr.aria-label]="'Cliente: ' + client.fullName">
  <div class="client-card__header">
    <div class="client-card__avatar" aria-hidden="true">{{ initials }}</div>

    <div class="client-card__info">
      <p class="client-card__name">{{ client.fullName }}</p>
      <p class="client-card__plan">{{ planLabel }}</p>
    </div>

    <span class="status" [ngClass]="statusClass">{{ statusLabel }}</span>

    <app-client-actions-menu
      [client]="client"
      (editRequested)="editRequested.emit($event)"
      (deactivateRequested)="deactivateRequested.emit($event)"
    ></app-client-actions-menu>
  </div>

  <div class="client-card__meta">
    <div class="client-card__meta-item" *ngIf="client.trainerName">
      <svg class="client-card__meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      <span>{{ client.trainerName }}</span>
    </div>

    <div class="client-card__meta-item">
      <svg class="client-card__meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      <span>Ingreso: {{ formattedJoinedAt }}</span>
    </div>

    <div class="client-card__meta-item" *ngIf="client.origin === 'referido' && client.referredByName">
      <svg class="client-card__meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span>Ref: {{ client.referredByName }}</span>
    </div>
  </div>
</article>
