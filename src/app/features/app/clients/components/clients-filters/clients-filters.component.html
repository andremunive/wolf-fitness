<div class="filters-wrapper">
  <button
    type="button"
    class="filters-toggle"
    [class.filters-toggle--active]="isOpen"
    (click)="togglePanel()"
    [attr.aria-expanded]="isOpen"
    aria-controls="clients-filters-panel"
    aria-label="Abrir filtros de clientes"
  >
    <svg class="filters-toggle__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L13 13.414V19a1 1 0 01-.553.894l-4 2A1 1 0 017 21v-7.586L3.293 6.707A1 1 0 013 6V4z"/>
    </svg>
    <span>Filtros</span>
    <span
      *ngIf="activeFilterCount > 0"
      class="filters-toggle__badge"
      [attr.aria-label]="activeFilterCount + ' filtros activos'"
    >{{ activeFilterCount }}</span>
  </button>

  <div
    *ngIf="isOpen"
    id="clients-filters-panel"
    class="filters-panel"
    [@panelExpand]
    [@filtersCascade]
    role="region"
    aria-label="Panel de filtros"
  >
    <!-- Estado de pago -->
    <div class="filter-group">
      <span class="filter-group__label">Por estado de pago</span>
      <div class="filter-chips" role="group" aria-label="Filtrar por estado de pago">
        <button
          *ngFor="let opt of paymentStatusOptions; trackBy: trackByValue"
          type="button"
          class="filter-chip"
          [class.filter-chip--active]="isPaymentStatusSelected(opt.value)"
          (click)="togglePaymentStatus(opt.value)"
          [attr.aria-pressed]="isPaymentStatusSelected(opt.value)"
        >{{ opt.label }}</button>
      </div>
    </div>

    <!-- Origen -->
    <div class="filter-group">
      <span class="filter-group__label">Por origen</span>
      <div class="filter-chips" role="group" aria-label="Filtrar por origen">
        <button
          *ngFor="let opt of originOptions; trackBy: trackByValue"
          type="button"
          class="filter-chip"
          [class.filter-chip--active]="isOriginSelected(opt.value)"
          (click)="toggleOrigin(opt.value)"
          [attr.aria-pressed]="isOriginSelected(opt.value)"
        >{{ opt.label }}</button>
      </div>
    </div>

    <!-- Entrenador -->
    <div class="filter-group">
      <label class="filter-group__label" for="clients-filter-trainer">Por entrenador</label>
      <select
        id="clients-filter-trainer"
        class="filter-group__select"
        [value]="localFilters.trainerId ?? ''"
        (change)="onTrainerChange($any($event.target).value)"
        aria-label="Filtrar por entrenador"
      >
        <option value="">Todos los entrenadores</option>
        <option
          *ngFor="let trainer of (trainers$ | async); trackBy: trackByTrainerId"
          [value]="trainer.id"
        >{{ trainer.fullName }}</option>
      </select>
    </div>

    <!-- Limpiar filtros -->
    <div class="filter-group filter-group--actions" *ngIf="hasActiveFilters">
      <button
        type="button"
        class="filters-clear"
        (click)="clearFilters()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        Limpiar filtros
      </button>
    </div>
  </div>
</div>
