<div class="share-backdrop" role="dialog" aria-modal="true" aria-labelledby="share-title" (click)="onDismiss()">
  <div class="share-sheet" (click)="$event.stopPropagation()" appFocusTrap (appFocusTrapEscape)="onDismiss()">

    <!-- ── Header icon ── -->
    <div class="share-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
      </svg>
    </div>

    <!-- ── Title ── -->
    <h2 id="share-title" class="share-title">Compartir medidas</h2>

    <!-- ──────────────────── IDLE STATE ──────────────────── -->
    <ng-container *ngIf="state === 'idle'">
      <p class="share-subtitle">
        ¿Enviar las medidas de
        <strong>{{ data.clientName }}</strong>
        a
        <strong>{{ data.clientEmail }}</strong>?
      </p>

      <!-- Date preview -->
      <div class="share-preview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"/>
        </svg>
        <span class="share-preview__label">
          <ng-container *ngIf="data.mode === 'single'">Medición del</ng-container>
          <ng-container *ngIf="data.mode === 'compare'">Período</ng-container>
        </span>
        <span class="share-preview__date">{{ data.measurementDateLabel }}</span>
      </div>

      <!-- Action buttons -->
      <div class="share-actions">
        <button
          type="button"
          class="share-btn share-btn--secondary"
          (click)="onDismiss()"
        >Cancelar</button>

        <button
          type="button"
          class="share-btn share-btn--primary"
          (click)="onSend()"
          aria-label="Enviar medidas por correo"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/>
          </svg>
          Enviar
        </button>
      </div>
    </ng-container>

    <!-- ──────────────────── SENDING STATE ──────────────────── -->
    <ng-container *ngIf="state === 'sending'">
      <div class="share-status share-status--sending" role="status" aria-live="polite">
        <span class="share-spinner" aria-hidden="true"></span>
        <span>Enviando correo a <strong>{{ data.clientEmail }}</strong>...</span>
      </div>

      <div class="share-actions">
        <button
          type="button"
          class="share-btn share-btn--secondary"
          disabled
          aria-disabled="true"
        >Cancelar</button>
      </div>
    </ng-container>

    <!-- ──────────────────── SENT STATE ──────────────────── -->
    <ng-container *ngIf="state === 'sent'">
      <div class="share-status share-status--sent" role="status">
        <svg class="share-status__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
        </svg>
        <span>Correo enviado a <strong>{{ data.clientEmail }}</strong></span>
      </div>

      <div class="share-actions share-actions--center">
        <button
          type="button"
          class="share-btn share-btn--primary"
          (click)="onDismiss()"
        >Cerrar</button>
      </div>
    </ng-container>

    <!-- ──────────────────── ERROR STATE ──────────────────── -->
    <ng-container *ngIf="state === 'error'">
      <div class="share-status share-status--error" role="alert">
        <svg class="share-status__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <div class="share-actions">
        <button
          type="button"
          class="share-btn share-btn--secondary"
          (click)="onDismiss()"
        >Cancelar</button>

        <button
          type="button"
          class="share-btn share-btn--danger"
          [disabled]="isSending"
          (click)="onRetry()"
          aria-label="Reintentar envío de medidas"
        >
          <ng-container *ngIf="!isSending; else retrySpinner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
            </svg>
            Reintentar
          </ng-container>
          <ng-template #retrySpinner>
            <span class="share-spinner share-spinner--sm" aria-hidden="true"></span>
            Enviando...
          </ng-template>
        </button>
      </div>
    </ng-container>

  </div>
</div>
