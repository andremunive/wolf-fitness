<div class="clients-page">

  <!-- ===== HEADER ===== -->
  <header class="clients-page__header">
    <div class="clients-page__header-content">
      <div class="clients-page__title-row">
        <h1 class="clients-page__title">
          Clientes
          <ng-container *ngIf="viewState$ | async as state">
            <span
              *ngIf="!state.loading"
              class="clients-page__count"
            >({{ state.total }})</span>
          </ng-container>
        </h1>
      </div>
    </div>
  </header>

  <!-- ===== BARRA DE BÚSQUEDA + FILTROS (sticky) ===== -->
  <div class="clients-page__toolbar">
    <div class="clients-page__search-row">
      <app-clients-search-bar
        class="clients-page__search"
        (searchChange)="onSearchChange($event)"
      ></app-clients-search-bar>

      <app-clients-filters
        [currentFilters]="currentFilters"
        (filtersChange)="onFiltersChange($event)"
        (filtersClear)="onFiltersClear()"
      ></app-clients-filters>
    </div>
  </div>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <main class="clients-page__main">
    <ng-container *ngIf="viewState$ | async as state">

      <!-- Loading skeleton -->
      <ng-container *ngIf="state.loading">
        <div class="clients-page__skeleton-list" aria-hidden="true">
          <div *ngFor="let i of [1,2,3,4,5]" class="skeleton-card">
            <div class="skeleton-card__header">
              <div class="skeleton skeleton--avatar"></div>
              <div class="skeleton-card__lines">
                <div class="skeleton skeleton--line-lg"></div>
                <div class="skeleton skeleton--line-sm"></div>
              </div>
              <div class="skeleton skeleton--pill"></div>
            </div>
            <div class="skeleton-card__meta">
              <div class="skeleton skeleton--line-md"></div>
              <div class="skeleton skeleton--line-md"></div>
            </div>
          </div>
        </div>

        <div class="clients-page__skeleton-table" aria-hidden="true">
          <div class="skeleton-table">
            <div class="skeleton-table__header skeleton skeleton--full"></div>
            <div *ngFor="let i of [1,2,3,4,5]" class="skeleton-table__row">
              <div class="skeleton skeleton--full"></div>
            </div>
          </div>
        </div>
      </ng-container>

      <!-- Error state -->
      <div *ngIf="state.error && !state.loading" class="clients-page__empty">
        <div class="clients-page__empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
          </svg>
        </div>
        <p class="clients-page__empty-title">Error al cargar clientes</p>
        <p class="clients-page__empty-msg">Revisa tu conexión e intenta de nuevo.</p>
        <button
          type="button"
          class="clients-page__retry-btn"
          (click)="retry()"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          Reintentar
        </button>
      </div>

      <!-- Empty state -->
      <div
        *ngIf="!state.loading && !state.error && state.clients.length === 0"
        class="clients-page__empty"
      >
        <div class="clients-page__empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z"/>
          </svg>
        </div>
        <p class="clients-page__empty-title">
          <ng-container *ngIf="searchControl.value; else noSearchTitle">
            No hay coincidencias para "{{ searchControl.value }}"
          </ng-container>
          <ng-template #noSearchTitle>No encontramos clientes</ng-template>
        </p>
        <p class="clients-page__empty-msg">
          <ng-container *ngIf="searchControl.value; else noSearchMsg">
            Prueba con otro término de búsqueda.
          </ng-container>
          <ng-template #noSearchMsg>No hay clientes registrados con esos criterios.</ng-template>
        </p>
      </div>

      <!-- Lista (mobile) / Tabla (desktop) -->
      <ng-container *ngIf="!state.loading && !state.error && state.clients.length > 0">

        <!-- Cards: solo en <768px -->
        <div class="clients-page__card-list">
          <app-client-card
            *ngFor="let client of state.clients; trackBy: trackByClientId"
            [client]="client"
            [isAdmin]="isAdmin"
            (editRequested)="onEditRequested($event)"
            (deactivateRequested)="onDeactivateRequested($event)"
            (registerPaymentRequested)="onRegisterPaymentRequested($event)"
            (measurementsRequested)="onMeasurementsRequested($event)"
          ></app-client-card>
        </div>

        <!-- Tabla: solo en ≥768px -->
        <div class="clients-page__table-wrapper">
          <app-clients-table
            [clients]="state.clients"
            [isAdmin]="isAdmin"
            (editRequested)="onEditRequested($event)"
            (deactivateRequested)="onDeactivateRequested($event)"
            (registerPaymentRequested)="onRegisterPaymentRequested($event)"
            (measurementsRequested)="onMeasurementsRequested($event)"
          ></app-clients-table>
        </div>

        <!-- Paginación -->
        <app-clients-pagination
          [state]="state.paginationState"
          (pageChange)="onPageChange($event)"
          (pageSizeChange)="onPageSizeChange($event)"
        ></app-clients-pagination>

      </ng-container>

    </ng-container>
  </main>

  <!-- Error de flujo de pago (toast inline simple) -->
  <div
    *ngIf="paymentFlowError"
    class="clients-page__payment-error"
    role="alert"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
    </svg>
    <span>{{ paymentFlowError }}</span>
    <button
      type="button"
      class="clients-page__payment-error-close"
      (click)="dismissPaymentFlowError()"
      aria-label="Cerrar aviso"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- ===== FAB nuevo cliente ===== -->
  <button
    type="button"
    class="clients-page__fab"
    (click)="openWizard()"
    aria-label="Nuevo cliente"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
    </svg>
  </button>

</div>

<!-- ===== WIZARD NUEVO CLIENTE ===== -->
<app-new-client-wizard
  *ngIf="isWizardOpen"
  (closed)="closeWizard()"
  (clientCreated)="onClientCreated($event.result)"
></app-new-client-wizard>

<!-- ===== MODAL ÉXITO / PASSWORD TEMPORAL ===== -->
<app-client-created-modal
  *ngIf="wizardResult"
  [result]="wizardResult"
  (dismissed)="dismissSuccessModal()"
></app-client-created-modal>

<!-- ===== MODAL EDITAR CLIENTE ===== -->
<app-edit-client-modal
  *ngIf="editingClient"
  [client]="editingClient"
  (closed)="closeEditModal()"
  (clientUpdated)="onClientUpdated()"
></app-edit-client-modal>

<!-- ===== MODAL REGISTRAR PAGO NUEVO ===== -->
<ng-container *ngIf="registerPaymentClient as payClient">
  <app-register-payment-modal
    [client]="payClient"
    [suggestedPeriodStart]="suggestedPeriodStart"
    [isFirstPayment]="isFirstPayment"
    (closed)="closeRegisterPaymentModal()"
    (paymentRegistered)="onPaymentRegistered($event)"
  ></app-register-payment-modal>
</ng-container>

<!-- ===== MODAL REGISTRAR ABONO ===== -->
<ng-container *ngIf="registerInstallmentClient as instClient">
  <ng-container *ngIf="openPaymentForInstallment as openPay">
    <app-register-installment-modal
      [client]="instClient"
      [openPayment]="openPay"
      (closed)="closeRegisterInstallmentModal()"
      (installmentRegistered)="onInstallmentRegistered($event)"
    ></app-register-installment-modal>
  </ng-container>
</ng-container>

<!-- ===== MODAL ÉXITO PAGO / ABONO ===== -->
<ng-container *ngIf="paymentSuccessData as successData">
  <app-payment-success-modal
    [data]="successData"
    (dismissed)="dismissPaymentSuccessModal()"
  ></app-payment-success-modal>
</ng-container>

<!-- ===== HUB DE MEDIDAS ===== -->
<app-measurements-hub-modal
  *ngIf="measurementsHubClient"
  [client]="measurementsHubClient"
  (closed)="onMeasurementsHubClosed()"
  (actionSelected)="onMeasurementsActionSelected($event)"
></app-measurements-hub-modal>

<!-- ===== MODAL REGISTRAR MEDIDA ===== -->
<app-register-measurement-modal
  *ngIf="measurementsAction === 'register' && measurementsRegisterClient"
  [client]="measurementsRegisterClient"
  (closed)="closeMeasurementsModal()"
  (measurementRegistered)="onMeasurementRegistered($event)"
></app-register-measurement-modal>

<!-- ===== MODAL CONSULTAR MEDIDAS ===== -->
<app-view-measurements-modal
  *ngIf="measurementsAction === 'view' && measurementsBaseClient"
  [client]="measurementsBaseClient"
  (closed)="closeMeasurementsModal()"
></app-view-measurements-modal>

<!-- ===== MODAL COMPARAR MEDIDAS ===== -->
<app-compare-measurements-modal
  *ngIf="measurementsAction === 'compare' && measurementsBaseClient"
  [client]="measurementsBaseClient"
  (closed)="closeMeasurementsModal()"
></app-compare-measurements-modal>

<!-- ===== MODAL REGISTRAR PESO ===== -->
<app-register-weight-log-modal
  *ngIf="weightRegisterClient"
  [client]="weightRegisterClient"
  (closed)="closeWeightRegisterModal()"
  (weightLogRegistered)="onWeightLogRegistered($event)"
></app-register-weight-log-modal>

<!-- ===== MODAL HISTORIAL DE PESO ===== -->
<app-weight-log-history-modal
  *ngIf="weightHistoryClient"
  [client]="weightHistoryClient"
  (closed)="closeWeightHistoryModal()"
  (registerRequested)="onWeightHistoryRegisterRequested()"
></app-weight-log-history-modal>
