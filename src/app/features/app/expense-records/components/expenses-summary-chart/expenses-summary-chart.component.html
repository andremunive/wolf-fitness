<div class="chart-card">

  <!-- Period chips -->
  <div class="chart-card__chips" role="group" aria-label="Período del gráfico">
    <button
      *ngFor="let filter of periodFilters"
      type="button"
      class="chip"
      [class.chip--active]="selectedPeriod === filter.key"
      (click)="selectPeriod(filter.key)"
      [attr.aria-pressed]="selectedPeriod === filter.key"
    >
      {{ filter.label }}
    </button>
  </div>

  <!-- Loading skeleton -->
  <div class="chart-card__loading" *ngIf="isLoading" aria-hidden="true">
    <div class="chart-card__skeleton-bars">
      <div *ngFor="let i of [1,2,3,4]" class="skeleton-bar">
        <div class="skeleton-bar__rect" [style.height.%]="(5 - i) * 20 + 20"></div>
        <div class="skeleton-bar__label"></div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div class="chart-card__empty" *ngIf="!isLoading && bars.length === 0">
    <div class="chart-card__empty-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zm6 0c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v6.75C13.5 20.496 12.996 21 12.375 21h-2.25A1.125 1.125 0 019 19.875v-6.75zm6-3.75c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v10.5C21 20.496 20.496 21 19.875 21h-2.25A1.125 1.125 0 0116.5 19.875V9.375z"/>
      </svg>
    </div>
    <p class="chart-card__empty-text">Sin egresos en el período seleccionado. Prueba con un rango diferente.</p>
  </div>

  <!-- Bars -->
  <div class="chart-card__bars-wrap" *ngIf="!isLoading && bars.length > 0" aria-label="Gráfico de egresos por categoría">
    <div class="chart-card__bars">
      <div
        *ngFor="let bar of bars; trackBy: trackByBarId"
        class="bar-col"
      >
        <div class="bar-col__amount">{{ bar.formattedAmount }}</div>
        <div class="bar-col__track">
          <div
            class="bar-col__fill"
            [style.height.%]="bar.heightPct"
            [style.background-color]="bar.bgColor"
            [style.border-color]="bar.borderColor"
          ></div>
        </div>
        <div class="bar-col__label">
          <span *ngIf="bar.categoryEmoji" class="bar-col__emoji">{{ bar.categoryEmoji }}</span>
          <span class="bar-col__name">{{ bar.categoryName }}</span>
        </div>
      </div>
    </div>
  </div>

</div>
