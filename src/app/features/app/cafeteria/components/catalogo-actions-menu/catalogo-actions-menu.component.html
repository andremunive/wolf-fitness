<div class="catalogo-actions">
  <button
    type="button"
    class="catalogo-actions__trigger"
    [class.catalogo-actions__trigger--open]="isOpen"
    (click)="toggle($event)"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="menu"
    [attr.aria-label]="'Acciones para ' + product.name"
  >
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="12" cy="5" r="1.6"/>
      <circle cx="12" cy="12" r="1.6"/>
      <circle cx="12" cy="19" r="1.6"/>
    </svg>
  </button>

  <div
    *ngIf="isOpen"
    class="catalogo-actions__dropdown"
    [ngStyle]="dropdownStyle"
    role="menu"
  >
    <button
      type="button"
      class="catalogo-actions__item"
      role="menuitem"
      (click)="onEdit()"
    >
      <span class="catalogo-actions__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </span>
      <span class="catalogo-actions__label">Editar</span>
    </button>

    <button
      type="button"
      class="catalogo-actions__item"
      role="menuitem"
      (click)="onUpdatePrice()"
    >
      <span class="catalogo-actions__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </span>
      <span class="catalogo-actions__label">Actualizar precio</span>
    </button>

    <button
      type="button"
      class="catalogo-actions__item"
      role="menuitem"
      (click)="onPriceHistory()"
    >
      <span class="catalogo-actions__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </span>
      <span class="catalogo-actions__label">Ver historial de precios</span>
    </button>
  </div>
</div>
