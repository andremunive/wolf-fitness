<div class="insumos-actions">
  <button
    type="button"
    class="insumos-actions__trigger"
    [class.insumos-actions__trigger--open]="isOpen"
    (click)="toggle($event)"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="menu"
    aria-label="Acciones del insumo"
  >
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <circle cx="12" cy="5" r="1.6"/>
      <circle cx="12" cy="12" r="1.6"/>
      <circle cx="12" cy="19" r="1.6"/>
    </svg>
  </button>

  <div
    *ngIf="isOpen"
    class="insumos-actions__dropdown"
    [ngStyle]="dropdownStyle"
    role="menu"
  >
    <button
      type="button"
      class="insumos-actions__item"
      role="menuitem"
      (click)="onDetail()"
    >
      <span class="insumos-actions__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </span>
      <span class="insumos-actions__label">Ver detalle</span>
    </button>

    <button
      type="button"
      class="insumos-actions__item"
      role="menuitem"
      (click)="onEdit()"
    >
      <span class="insumos-actions__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </span>
      <span class="insumos-actions__label">Editar</span>
    </button>

    <button
      type="button"
      class="insumos-actions__item insumos-actions__item--danger"
      role="menuitem"
      (click)="onVoid()"
    >
      <span class="insumos-actions__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
        </svg>
      </span>
      <span class="insumos-actions__label">Anular</span>
    </button>
  </div>
</div>
